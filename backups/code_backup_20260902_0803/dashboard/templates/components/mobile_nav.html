<!-- Mobile FAB (contextuel) -->
<button class="m-fab" id="mobile-fab" onclick="handleFabAction()" title="Action rapide">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
</button>

<script>
// ── Mobile Nav Active State ────────────────────────────────
function updateMobileNav(clickedItem) {
    document.querySelectorAll('.mobile-nav-item').forEach(function(item) {
        item.classList.remove('active');
    });
    // Find the matching mobile nav item if we clicked a desktop nav item
    var section = clickedItem.id ? clickedItem.id.replace('-m', '') : null;
    if (section) {
        var mobileItem = document.getElementById(section + '-m');
        if (mobileItem) mobileItem.classList.add('active');
        else clickedItem.classList.add('active');
    } else {
        clickedItem.classList.add('active');
    }
    updateFabForSection();
}

// ── FAB contextuel ─────────────────────────────────────────
var _fabActions = {
    'cockpit': { icon: 'refresh', action: function() { if(typeof refreshAll === 'function') refreshAll(); } },
    'campagne': { icon: 'plus', action: function() { if(typeof openNewLeadModal === 'function') openNewLeadModal(); } },
    'tracking': { icon: 'plus', action: function() { } },
    'planificateur': { icon: 'plus', action: function() { } },
    'settings': { icon: 'settings', action: function() { } }
};

var _currentSection = 'cockpit';

function updateFabForSection() {
    var fab = document.getElementById('mobile-fab');
    if (!fab) return;
    // Show fab only on certain sections
    fab.style.display = 'flex';
}

function handleFabAction() {
    var action = _fabActions[_currentSection];
    if (action && action.action) action.action();
}

// Override nav to track current section
var _origNav = window.nav;
window.nav = function(section, el) {
    _currentSection = section;
    if (_origNav) _origNav(section, el);
    // Also sync mobile nav
    document.querySelectorAll('.mobile-nav-item').forEach(function(item) {
        item.classList.remove('active');
    });
    var mItem = document.getElementById('nav-' + section + '-m');
    if (mItem) mItem.classList.add('active');
    updateFabForSection();
};
</script>
