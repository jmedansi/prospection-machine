<!-- Health dot updater -->
<script>
(function() {
    function updateHealthDot(status) {
        var dot = document.getElementById('sb-health-dot');
        if (!dot) return;
        dot.className = 'sb-health-dot';
        if (status === 'ok') dot.classList.add('ok');
        else if (status === 'warn') dot.classList.add('warn');
        else if (status === 'error') dot.classList.add('error');
        dot.title = status === 'ok' ? 'Système opérationnel'
                  : status === 'warn' ? 'Avertissements système'
                  : status === 'error' ? 'Erreurs système' : 'Statut inconnu';
    }

    function checkHealth() {
        fetch('/api/health')
            .then(function(r) { return r.json(); })
            .then(function(d) {
                updateHealthDot(d.status === 'healthy' ? 'ok' : d.status === 'warning' ? 'warn' : 'error');
            })
            .catch(function() { updateHealthDot('error'); });
    }

    document.addEventListener('DOMContentLoaded', function() {
        checkHealth();
        setInterval(checkHealth, 60000);
    });
})();
</script>
